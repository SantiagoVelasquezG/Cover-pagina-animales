@if (cat) {
  <div class="container py-4">
    <div class="detail-container">
      <a routerLink="/cats" class="btn btn-outline-secondary btn-volver mb-4">← Volver a gatos</a>

      <div class="card detail-card">
        <div class="detail-header text-center">
          <div class="pet-emoji-large">🐱</div>
          <h2 class="fw-bold mt-2 text-white">{{ cat.name }}</h2>
          <span class="badge bg-white text-dark rounded-pill px-3 py-2">{{ cat.age }} años</span>
        </div>

        <div class="card-body p-4">
          <table class="table detail-table">
            <tbody>
              <tr>
                <th>Raza</th>
                <td>{{ cat.breed }}</td>
              </tr>
              <tr>
                <th>Género</th>
                <td>{{ cat.gender }}</td>
              </tr>
              <tr>
                <th>Descripción</th>
                <td>{{ cat.description }}</td>
              </tr>
            </tbody>
          </table>

          <button class="btn btn-adoptar w-100 mt-2">
            ❤️ Quiero adoptar a {{ cat.name }}
          </button>
        </div>
      </div>
    </div>
  </div>
} @else {
  <div class="text-center mt-5">
    <h3>🐱 Gato no encontrado</h3>
    <a routerLink="/cats" class="btn btn-warning mt-3 rounded-pill">Volver al listado</a>
  </div>
}
