<div class="container py-4">
  <h2 class="page-title mb-4">🐱 Gatos en adopción</h2>

  <div class="row row-cols-1 row-cols-md-3 g-4">
    @for (cat of cats; track cat.id) {
      <div class="col">
        <div class="card pet-card h-100">
          <div class="card-body text-center pt-4">
            <div class="pet-emoji mb-2">🐱</div>
            <h5 class="card-title fw-bold">{{ cat.name }}</h5>
            <p class="card-text text-muted small">{{ cat.description }}</p>
            <span class="badge rounded-pill bg-warning text-dark">{{ cat.age }} años</span>
          </div>
          <div class="card-footer bg-transparent border-0 pb-4 text-center">
            <a [routerLink]="['/cats', cat.id]" class="btn btn-adoptar px-4">
              Ver más 🐱
            </a>
          </div>
        </div>
      </div>
    }
  </div>
</div>
